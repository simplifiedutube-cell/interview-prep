<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 6.0 1203.0 750.0" width="1203" height="750" role="img" aria-label="Agentic Coding Assistant"><title>Agentic Coding Assistant</title><defs><marker id="m0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0.5,1 L9,5 L0.5,9 z" fill="#1e1e1e"/></marker></defs><rect x="16.0" y="6.0" width="1203.0" height="750.0" fill="#ffffff"/><rect x="40.0" y="160.0" width="150.0" height="76.0" rx="19.0" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="235.0" y="160.0" width="150.0" height="76.0" rx="19.0" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="40.0" y="320.0" width="160.0" height="82.0" rx="20.5" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="245.0" y="320.0" width="150.0" height="82.0" rx="20.5" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="440.0" y="320.0" width="160.0" height="82.0" rx="20.5" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="645.0" y="320.0" width="150.0" height="82.0" rx="20.5" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="840.0" y="320.0" width="150.0" height="82.0" rx="20.5" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><rect x="1035.0" y="320.0" width="160.0" height="82.0" rx="20.5" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="40.0" y="460.0" width="470.0" height="112.0" rx="28.0" fill="#ffc9c9" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/><rect x="560.0" y="490.0" width="500.0" height="118.0" rx="29.5" fill="#ffec99" stroke="#f08c00" stroke-width="2" stroke-dasharray="8 6"/><rect x="40.0" y="640.0" width="640.0" height="92.0" rx="23.0" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" stroke-dasharray="8 6"/><line x1="190.0" y1="198.0" x2="230.6" y2="198.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="310.0" y1="236.0" x2="124.0" y2="318.2" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="200.0" y1="361.0" x2="240.6" y2="361.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="395.0" y1="361.0" x2="435.6" y2="361.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="600.0" y1="361.0" x2="640.6" y2="361.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="795.0" y1="361.0" x2="835.6" y2="361.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="990.0" y1="361.0" x2="1030.6" y2="361.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="915.0" y1="402.0" x2="124.4" y2="320.5" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#m0)"/><text font-size="28" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="55.9">Agentic Coding Assistant</tspan></text><text font-size="14" text-anchor="start" fill="#495057" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="81.0">Turing · multi-step orchestration wired into PR and CI/CD review workflows — not GUI-only usage</tspan></text><text font-size="16" text-anchor="start" fill="#1971c2" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="144.8">TRIGGER</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="115.0" y="193.4">PR opened /</tspan><tspan x="115.0" y="210.9">updated</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="310.0" y="193.8">Webhook →</tspan><tspan x="310.0" y="210.0">CI/CD hook</tspan></text><text font-size="16" text-anchor="start" fill="#2f9e44" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="304.8">AGENT LOOP</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="120.0" y="348.6">Orchestrator</tspan><tspan x="120.0" y="364.9">(plan → act →</tspan><tspan x="120.0" y="381.1">verify)</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="320.0" y="349.6">Context build</tspan><tspan x="320.0" y="364.6">(diff + repo</tspan><tspan x="320.0" y="379.6">retrieval)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="520.0" y="348.6">Tool calls</tspan><tspan x="520.0" y="364.9">(MCP where</tspan><tspan x="520.0" y="381.1">available)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="720.0" y="356.8">Propose edits</tspan><tspan x="720.0" y="373.0">+ rationale</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="915.0" y="356.8">Run tests /</tspan><tspan x="915.0" y="373.0">lint / build</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="1115.0" y="356.8">Post review</tspan><tspan x="1115.0" y="373.0">comments on PR</tspan></text><text font-size="13" text-anchor="start" fill="#495057" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="457.2" y="352.2">retry on failure</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="50.0" y="482.0">GUARDRAILS ON THE LOOP — interviewers probe this</tspan><tspan x="50.0" y="498.3">  · step / token / cost caps per run</tspan><tspan x="50.0" y="514.5">  · loop detection by (tool, args) hash</tspan><tspan x="50.0" y="530.8">  · human stays the approver — agent never merges</tspan><tspan x="50.0" y="547.0">  · idempotency so a replayed webhook doesn't double-post</tspan></text><text font-size="16" text-anchor="start" fill="#f08c00" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="560.0" y="474.8">MEASURED OUTCOME</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="570.0" y="512.0">Metric: PR-opened → first human review comment.</tspan><tspan x="570.0" y="528.3">NOT merge time — say which interval you measured.</tspan><tspan x="570.0" y="544.5">Named confounder: an auto-assign-reviewer bot landed in</tspan><tspan x="570.0" y="560.8">the same window. Split the credit explicitly, unprompted —</tspan><tspan x="570.0" y="577.0">that split is what makes the number believable.</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="50.0" y="662.0">MCP TIMELINE — fix this before someone does the subtraction</tspan><tspan x="50.0" y="678.3">MCP was announced 25 Nov 2024; the engagement ended Jan 2025.</tspan><tspan x="50.0" y="694.5">The orchestration ran the full engagement on plain function-calling;</tspan><tspan x="50.0" y="710.8">MCP came in near the end. Say it that way.</tspan></text></svg>