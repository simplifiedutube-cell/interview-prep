if,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="55.9">Enterprise RAG Knowledge Assistant</tspan></text><text font-size="14" text-anchor="start" fill="#495057" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="81.0">KNS Technologies · 10,000+ document knowledge base · student-facing, with guardrails and eval dashboards</tspan></text><text font-size="16" text-anchor="start" fill="#1971c2" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="144.8">INGEST</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="115.0" y="193.8">Knowledge base</tspan><tspan x="115.0" y="210.0">10,000+ docs</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="307.5" y="193.4">Chunk</tspan><tspan x="307.5" y="210.9">+ metadata</tspan></text><text font-size="15" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="497.5" y="202.5">Embeddings</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="687.5" y="193.4">Pinecone</tspan><tspan x="687.5" y="210.9">index</tspan></text><text font-size="16" text-anchor="start" fill="#2f9e44" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="314.8">SERVE</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="112.5" y="363.4">Student</tspan><tspan x="112.5" y="380.9">(Next.js)</tspan></text><text font-size="16" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="302.5" y="372.8">FastAPI</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="492.5" y="363.8">Semantic +</tspan><tspan x="492.5" y="380.0">prompt cache</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="682.5" y="363.4">Retrieve</tspan><tspan x="682.5" y="380.9">top-k</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="872.5" y="363.8">Model router</tspan><tspan x="872.5" y="380.0">small ↔ large</tspan></text><text font-size="15" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="1062.5" y="372.5">LLM answer</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="1257.5" y="363.8">Hallucination</tspan><tspan x="1257.5" y="380.0">guardrail</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="430.0" y="472.0">THE −40% LATENCY / −30% COST STORY</tspan><tspan x="430.0" y="488.3">Name the mechanisms and what each one cost you:</tspan><tspan x="430.0" y="504.5">  1. prompt-prefix caching on the frozen system prompt</tspan><tspan x="430.0" y="520.8">  2. retrieval funnel cut (top-k down, rerank up)</tspan><tspan x="430.0" y="537.0">  3. routing the easy majority to a smaller model</tspan><tspan x="430.0" y="553.3">Streaming is SEPARATE — perceived latency, not total.</tspan></text><text font-size="16" text-anchor="start" fill="#f08c00" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="634.8">MEASURE  (the part that defends the numbers)</tspan></text><text font-size="11" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="117.5" y="677.5">Eval set</tspan><tspan x="117.5" y="691.3">(real queries,</tspan><tspan x="117.5" y="705.0">not chunk-derived)</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="317.5" y="676.6">Judge</tspan><tspan x="317.5" y="691.6">validated vs</tspan><tspan x="317.5" y="706.6">human labels</tspan></text><text font-size="11" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="517.5" y="677.5">Eval dashboard</tspan><tspan x="517.5" y="691.3">+ accuracy</tspan><tspan x="517.5" y="705.0">tracked in prod</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="660.0" y="642.0">LEAKAGE TRAP — volunteer this, it is a maturity signal</tspan><tspan x="660.0" y="658.3">If eval questions are generated FROM the indexed chunks, you are</tspan><tspan x="660.0" y="674.5">grading retrieval on its own answer key and the score is inflated.</tspan><tspan x="660.0" y="690.8">Source eval questions from real user queries instead.</tspan></text></svg>