="790.0" y1="483.0" x2="831.5" y2="450.7" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="975.0" y1="448.0" x2="1015.6" y2="448.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="1170.0" y1="448.0" x2="1210.6" y2="448.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="715.0" y1="228.0" x2="715.0" y2="367.6" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#m0)"/><line x1="715.0" y1="320.0" x2="715.0" y2="447.6" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#m0)"/><line x1="205.0" y1="768.0" x2="245.6" y2="768.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="405.0" y1="768.0" x2="445.6" y2="768.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="625.0" y1="768.0" x2="665.6" y2="768.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><text font-size="28" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="55.9">AML/CTF Compliance Knowledge Assistant</tspan></text><text font-size="14" text-anchor="start" fill="#495057" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="81.0">Multi-tenant retrieval over the Australian AML/CTF Act, Rules &amp; AUSTRAC guidance + each firm's own procedures</tspan></text><text font-size="16" text-anchor="start" fill="#1971c2" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="134.8">INGEST  (offline, per tenant)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="122.5" y="176.7">AML/CTF Act</tspan><tspan x="122.5" y="192.9">Rules · AUSTRAC</tspan><tspan x="122.5" y="209.2">firm procedures</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="325.0" y="176.7">Structure-aware</tspan><tspan x="325.0" y="192.9">chunker</tspan><tspan x="325.0" y="209.2">+ overlap</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="520.0" y="184.4">Embedding</tspan><tspan x="520.0" y="201.9">model</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="715.0" y="184.4">Dense vector</tspan><tspan x="715.0" y="201.9">store</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="715.0" y="280.4">SQLite FTS5</tspan><tspan x="715.0" y="297.9">(BM25)</tspan></text><text font-size="13" text-anchor="start" fill="#495057" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="489.8" y="228.2">raw text</tspan></text><text font-size="16" text-anchor="start" fill="#2f9e44" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="394.8">QUERY</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="110.0" y="443.4">Client</tspan><tspan x="110.0" y="460.9">(demo UI)</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="300.0" y="443.4">FastAPI</tspan><tspan x="300.0" y="460.9">+ Pydantic</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="502.5" y="443.8">Tenant resolver</tspan><tspan x="502.5" y="460.0">→ SQL predicate</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="715.0" y="398.8">Dense ANN</tspan><tspan x="715.0" y="415.0">top-k</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="715.0" y="478.8">BM25 FTS5</tspan><tspan x="715.0" y="495.0">top-k</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="905.0" y="443.8">RRF fusion</tspan><tspan x="905.0" y="460.0">Σ 1/(60+rank)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="1095.0" y="443.8">Cross-encoder</tspan><tspan x="1095.0" y="460.0">rerank → top-5</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="1290.0" y="443.4">LLM answer</tspan><tspan x="1290.0" y="460.9">+ citations</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="410.0" y="567.0">DESIGN DECISION — the one to lead with</tspan><tspan x="410.0" y="583.3">Tenant isolation is a SQL predicate applied BEFORE retrieval,</tspan><tspan x="410.0" y="599.5">not a prompt instruction. A prompt can be talked out of it;</tspan><tspan x="410.0" y="615.8">a WHERE clause cannot. Fails closed if the predicate is missing.</tspan></text><text font-size="16" text-anchor="start" fill="#f08c00" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="714.8">EVAL  (what makes this defensible)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="122.5" y="755.6">Golden set</tspan><tspan x="122.5" y="771.9">60–80 queries</tspan><tspan x="122.5" y="788.1">+ adversarial</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="327.5" y="756.6">Binary LLM judge</tspan><tspan x="327.5" y="771.6">TPR / TNR vs</tspan><tspan x="327.5" y="786.6">human labels</tspan></text><text font-size="11" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="537.5" y="757.5">Retrieval: recall@k, MRR</tspan><tspan x="537.5" y="771.3">vs</tspan><tspan x="537.5" y="785.0">Generation: groundedness</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="747.5" y="763.8">CI regression gate</tspan><tspan x="747.5" y="780.0">fails the PR</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="880.0" y="722.0">ABLATION TABLE — build this, it is the interview asset</tspan><tspan x="880.0" y="738.3">  dense only            → recall@5 ___</tspan><tspan x="880.0" y="754.5">  + BM25 / RRF          → recall@5 ___</tspan><tspan x="880.0" y="770.8">  + cross-encoder rerank→ recall@5 ___</tspan><tspan x="880.0" y="787.0">Plus a p50/p95 latency and $/query column per row.</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="50.0" y="902.0">WHAT BREAKS AT 10M DOCS (have this ready)</tspan><tspan x="50.0" y="918.3">~150M chunks x 1024 dims x 4 bytes ≈ 614 GB — the index stops fitting in RAM.</tspan><tspan x="50.0" y="934.5">First failure is memory, not the LLM. Then: the tenant filter turns ANN into a</tspan><tspan x="50.0" y="950.8">recall cliff, and the cross-encoder becomes the latency floor.</tspan></text></svg>