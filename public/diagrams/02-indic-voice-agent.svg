.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="215.0" y1="705.0" x2="260.6" y2="705.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><text font-size="28" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="55.9">Real-Time Indic Voice Agent</tspan></text><text font-size="14" text-anchor="start" fill="#495057" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="81.0">Code-mixed Telugu/English · sub-800ms round-trip budget · config-driven multi-tenancy</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="105.0" y="225.4">Caller</tspan><tspan x="105.0" y="242.9">(browser)</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="280.0" y="225.4">WebRTC</tspan><tspan x="280.0" y="242.9">transport</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="455.0" y="225.8">VAD +</tspan><tspan x="455.0" y="242.0">endpointing</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="630.0" y="225.8">Sarvam STT</tspan><tspan x="630.0" y="242.0">(streaming)</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805.0" y="225.4">Gemini</tspan><tspan x="805.0" y="242.9">(streaming)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="980.0" y="225.8">Sarvam TTS</tspan><tspan x="980.0" y="242.0">(streaming)</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="1155.0" y="225.4">Audio out</tspan><tspan x="1155.0" y="242.9">→ caller</tspan></text><text font-size="16" text-anchor="start" fill="#f08c00" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="334.8">PER-HOP LATENCY BUDGET  — instrument every arrow, p50 and p95</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="455.0" y="382.1">endpointing</tspan><tspan x="455.0" y="397.1">___ ms</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="630.0" y="382.1">STT final</tspan><tspan x="630.0" y="397.1">___ ms</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805.0" y="382.1">LLM TTFT</tspan><tspan x="805.0" y="397.1">___ ms</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="980.0" y="382.1">TTS first byte</tspan><tspan x="980.0" y="397.1">___ ms</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="1155.0" y="382.1">network</tspan><tspan x="1155.0" y="397.1">___ ms</tspan></text><text font-size="14" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="50.0" y="377.9">TOTAL BUDGET  &lt; 800 ms round trip</tspan><tspan x="50.0" y="395.4">Measured, not estimated.</tspan></text><text font-size="16" text-anchor="start" fill="#e03131" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="484.8">BARGE-IN PATH  (the detail that separates you)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="122.5" y="536.8">Speech detected</tspan><tspan x="122.5" y="553.0">mid-response</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="332.5" y="536.8">Cancel TTS +</tspan><tspan x="332.5" y="553.0">flush buffers</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="542.5" y="536.8">Abort LLM</tspan><tspan x="542.5" y="553.0">stream</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="752.5" y="536.8">Re-open STT</tspan><tspan x="752.5" y="553.0">&lt; 150 ms total</tspan></text><text font-size="16" text-anchor="start" fill="#1971c2" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="644.8">MULTI-TENANCY</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="127.5" y="693.6">config/&lt;tenant&gt;/</tspan><tspan x="127.5" y="708.6">prompts · voices ·</tspan><tspan x="127.5" y="723.6">tools · numbers</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="347.5" y="700.5">Same runtime</tspan><tspan x="347.5" y="718.0">image</tspan></text><text font-size="13" text-anchor="start" fill="#495057" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="183.4" y="696.2">mounted at boot</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480.0" y="682.0">A new client deploys by swapping a config folder.</tspan><tspan x="480.0" y="698.3">Zero code changes, zero rebuild. This is the line that</tspan><tspan x="480.0" y="714.5">makes it sound like a product rather than a demo.</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="50.0" y="812.0">THE HARD PART — say this unprompted</tspan><tspan x="50.0" y="828.3">Code-mixed Telugu/English breaks naive pipelines: the STT has to survive</tspan><tspan x="50.0" y="844.5">intra-sentence language switching, and Indic scripts inflate token counts</tspan><tspan x="50.0" y="860.8">3–8x per character vs English — which moves both cost and TTFT.</tspan><tspan x="50.0" y="877.0">Report Telugu WER and code-mixed WER separately; the gap is the story.</tspan></text></svg>