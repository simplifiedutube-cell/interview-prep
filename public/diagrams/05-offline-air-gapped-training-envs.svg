"545.0" width="160.0" height="76.0" rx="19.0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="40.0" y="665.0" width="700.0" height="92.0" rx="23.0" fill="#e9ecef" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/><line x1="215.0" y1="232.0" x2="260.6" y2="232.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="415.0" y1="232.0" x2="460.6" y2="232.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="630.0" y1="232.0" x2="675.6" y2="232.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="845.0" y1="232.0" x2="890.6" y2="232.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="1060.0" y1="232.0" x2="1105.6" y2="232.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="200.0" y1="583.0" x2="240.6" y2="583.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="405.0" y1="583.0" x2="445.6" y2="583.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="610.0" y1="583.0" x2="650.6" y2="583.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="815.0" y1="583.0" x2="855.6" y2="583.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><text font-size="28" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="55.9">Offline AI Agent Training Environments</tspan></text><text font-size="14" text-anchor="start" fill="#495057" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="81.0">Turing · containerized web apps running with NO network access · every agent action verified against app state</tspan></text><text font-size="15" text-anchor="start" fill="#e03131" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="50.0" y="145.9">AIR-GAPPED BOUNDARY — no egress, no registry, no external DNS</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="137.5" y="227.4">AI agent</tspan><tspan x="137.5" y="244.9">under training</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="340.0" y="227.4">Headless</tspan><tspan x="340.0" y="244.9">browser</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="547.5" y="219.7">React / TS</tspan><tspan x="547.5" y="235.9">web app</tspan><tspan x="547.5" y="252.2">(the task env)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="762.5" y="227.8">App state store</tspan><tspan x="762.5" y="244.0">(instrumented)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="977.5" y="227.8">Deterministic</tspan><tspan x="977.5" y="244.0">state verifier</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="1155.0" y="227.4">pass /</tspan><tspan x="1155.0" y="244.9">fail</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="547.5" y="360.4">Playwright</tspan><tspan x="547.5" y="377.9">harness</tspan></text><text font-size="12" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="70.0" y="341.1">WHY DETERMINISTIC VERIFICATION MATTERS</tspan><tspan x="70.0" y="356.1">Checking app state — not screenshots, not an LLM judge —</tspan><tspan x="70.0" y="371.1">means the grader is exact and reproducible. That is what</tspan><tspan x="70.0" y="386.1">makes it a verifiable reward function, not a vibe check.</tspan></text><text font-size="16" text-anchor="start" fill="#1971c2" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="524.8">DELIVERY INTO THE GAP</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="120.0" y="578.8">Multi-stage</tspan><tspan x="120.0" y="595.0">Docker build</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="325.0" y="578.8">Vendored wheels</tspan><tspan x="325.0" y="595.0">+ pinned deps</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="530.0" y="579.1">Single immutable</tspan><tspan x="530.0" y="594.1">OCI artifact</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="735.0" y="578.8">Signed transfer</tspan><tspan x="735.0" y="595.0">across the gap</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="940.0" y="578.8">Runs with</tspan><tspan x="940.0" y="595.0">zero egress</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="50.0" y="687.0">THE QUESTIONS THIS INVITES — have answers ready</tspan><tspan x="50.0" y="703.3">  · How do you patch a CVE with no registry?</tspan><tspan x="50.0" y="719.5">  · How does telemetry get OUT of the gap?</tspan><tspan x="50.0" y="735.8">  · How do you reproduce a run six months later? (pin everything, including the base image digest)</tspan></text></svg>