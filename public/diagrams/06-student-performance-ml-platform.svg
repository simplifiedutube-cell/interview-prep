<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 6.0 1318.0 720.0" width="1318" height="720" role="img" aria-label="Student Performance ML Platform"><title>Student Performance ML Platform</title><defs><marker id="m0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0.5,1 L9,5 L0.5,9 z" fill="#1e1e1e"/></marker></defs><rect x="16.0" y="6.0" width="1318.0" height="720.0" fill="#ffffff"/><rect x="40.0" y="160.0" width="160.0" height="80.0" rx="20.0" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="245.0" y="160.0" width="160.0" height="80.0" rx="20.0" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="450.0" y="160.0" width="170.0" height="80.0" rx="20.0" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="665.0" y="160.0" width="170.0" height="80.0" rx="20.0" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="880.0" y="150.0" width="430.0" height="100.0" rx="25.0" fill="#ffc9c9" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/><rect x="40.0" y="330.0" width="165.0" height="80.0" rx="20.0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="250.0" y="330.0" width="165.0" height="80.0" rx="20.0" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><rect x="460.0" y="330.0" width="175.0" height="80.0" rx="20.0" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><rect x="680.0" y="330.0" width="175.0" height="80.0" rx="20.0" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="900.0" y="330.0" width="165.0" height="80.0" rx="20.0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="40.0" y="450.0" width="500.0" height="118.0" rx="29.5" fill="#ffec99" stroke="#f08c00" stroke-width="2" stroke-dasharray="8 6"/><rect x="590.0" y="485.0" width="160.0" height="72.0" rx="18.0" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="795.0" y="485.0" width="175.0" height="72.0" rx="18.0" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="1015.0" y="485.0" width="160.0" height="72.0" rx="18.0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="40.0" y="610.0" width="620.0" height="92.0" rx="23.0" fill="#e9ecef" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/><line x1="200.0" y1="200.0" x2="240.6" y2="200.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="405.0" y1="200.0" x2="445.6" y2="200.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="620.0" y1="200.0" x2="660.6" y2="200.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="750.0" y1="240.0" x2="126.9" y2="329.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="205.0" y1="370.0" x2="245.6" y2="370.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="415.0" y1="370.0" x2="455.6" y2="370.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="635.0" y1="370.0" x2="895.6" y2="370.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="855.0" y1="370.0" x2="895.6" y2="370.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="750.0" y1="521.0" x2="790.6" y2="521.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><line x1="970.0" y1="521.0" x2="1010.6" y2="521.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><text font-size="28" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="55.9">Student Performance ML Platform</tspan></text><text font-size="14" text-anchor="start" fill="#495057" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="81.0">KNS Technologies · at-risk prediction over assessment records + automatic balanced team formation</tspan></text><text font-size="16" text-anchor="start" fill="#1971c2" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="144.8">DATA → FEATURES</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="120.0" y="187.7">Assessment</tspan><tspan x="120.0" y="203.9">records</tspan><tspan x="120.0" y="220.2">(~50,000)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="325.0" y="187.7">Grouped by</tspan><tspan x="325.0" y="203.9">STUDENT</tspan><tspan x="325.0" y="220.2">(not by row)</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="535.0" y="188.6">Point-in-time</tspan><tspan x="535.0" y="203.6">features</tspan><tspan x="535.0" y="218.6">(as-of week W)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="750.0" y="187.7">GroupKFold</tspan><tspan x="750.0" y="203.9">split on</tspan><tspan x="750.0" y="220.2">student_id</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="890.0" y="172.0">THE MOVE THAT WINS THIS CLAIM</tspan><tspan x="890.0" y="188.3">50,000 records ≈ a few thousand STUDENTS. Records from one</tspan><tspan x="890.0" y="204.5">student are correlated, so a random row split leaks and inflates</tspan><tspan x="890.0" y="220.8">the score. Volunteer this before you are asked.</tspan></text><text font-size="16" text-anchor="start" fill="#2f9e44" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="40.0" y="314.8">MODEL</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="122.5" y="357.6">sklearn</tspan><tspan x="122.5" y="373.9">classifier</tspan><tspan x="122.5" y="390.1">(at-risk flag)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="332.5" y="365.8">Probability</tspan><tspan x="332.5" y="382.0">calibration</tspan></text><text font-size="12" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="547.5" y="358.6">Threshold from</tspan><tspan x="547.5" y="373.6">a COST matrix</tspan><tspan x="547.5" y="388.6">(not 0.5)</tspan></text><text font-size="11" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="767.5" y="359.6">Bayesian network</tspan><tspan x="767.5" y="373.3">(secondary —</tspan><tspan x="767.5" y="387.1">interpretability)</tspan></text><text font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="982.5" y="365.4">Advisor</tspan><tspan x="982.5" y="382.9">worklist</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="50.0" y="472.0">METRICS — never lead with accuracy</tspan><tspan x="50.0" y="488.3">  · state the majority-class baseline FIRST; the lift is the number</tspan><tspan x="50.0" y="504.5">  · FN = a student who needed help and didn't get it</tspan><tspan x="50.0" y="520.8">  · FP = a short advisor conversation</tspan><tspan x="50.0" y="537.0">  Those costs are not equal, so 0.5 was never the right threshold.</tspan></text><text font-size="16" text-anchor="start" fill="#6741d9" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="590.0" y="464.8">TEAM FORMATION  (separate feature)</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="670.0" y="516.8">Per-student</tspan><tspan x="670.0" y="533.0">feature vector</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="882.5" y="516.8">Greedy balancing</tspan><tspan x="882.5" y="533.0">heuristic</tspan></text><text font-size="13" text-anchor="middle" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="1095.0" y="516.8">Balanced</tspan><tspan x="1095.0" y="533.0">project teams</tspan></text><text font-size="13" text-anchor="start" fill="#1e1e1e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="50.0" y="632.0">WHAT YOU'D ADD TODAY — say this before they ask</tspan><tspan x="50.0" y="648.3">No formal drift monitoring at handover. In EdTech the label arrives</tspan><tspan x="50.0" y="664.5">months late, so you monitor feature/prediction drift now and model</tspan><tspan x="50.0" y="680.8">quality on a delayed labelled sample. That gap is the honest answer.</tspan></text></svg>